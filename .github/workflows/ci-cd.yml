# Nombre del Workflow
name: CI/CD Pipeline AWS ECS con CloudFormation

on:
  push:
    branches:
      - dev
      - staging
      - main
  pull_request:
    branches:
      - dev
      - staging
      - main
  workflow_dispatch:

jobs:
  # ------------------------------------------------
  # JOB: Build, Test, Sonar y Push Docker (solo staging y main)
  # ------------------------------------------------
  build-test-publish:
    runs-on: ubuntu-latest
    outputs:
      repo_name: ${{ steps.set_outputs.outputs.repo_name }}
      image_tag: ${{ steps.set_outputs.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Black (Formatter)
        run: black app --check

      - name: Run Pylint
        run: pylint app --output-format=text --fail-under=9 > pylint-report.txt || true

      - name: Run Flake8
        run: flake8 app --output-file=flake8-report.txt || true

      - name: Run Unit Tests
        run: pytest --ignore=tests/test_acceptance_app.py --ignore=tests/test_smoke_app.py

      - name: Upload Test Reports Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            htmlcov/
            report.html

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # ---- Docker Build & Push (solo en staging y main) ----
      - name: Set up QEMU
        if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        id: docker_build_push
        if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            jeroggz/proyecto-cicd:${{ github.ref_name }}-${{ github.sha }}
            jeroggz/proyecto-cicd:${{ github.ref_name }}-latest

      - name: Set Job Outputs
        id: set_outputs
        if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'
        run: |
          echo "repo_name=${{ github.event.repository.name }}" >> $GITHUB_OUTPUT
          echo "image_tag=${{ github.sha }}" >> $GITHUB_OUTPUT

  # ------------------------------------------------
  # JOB: Deploy a Staging
  # ------------------------------------------------
  deploy-cfn-staging:
    needs: build-test-publish
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'
    outputs:
      alb_url_staging: ${{ steps.get_stack_outputs.outputs.alb_url }}
      cluster_name_staging: "calculadora-staging-cluster"
      service_name_staging: "calculadora-staging-service"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Deploy CloudFormation Staging
        run: |
          IMAGE_URI="jeroggz/proyecto-cicd:staging-${{ needs.build-test-publish.outputs.image_tag }}"
          echo "Deploying Image: $IMAGE_URI"

          aws cloudformation deploy \
            --template-file template.yaml \
            --stack-name calculadora-staging-stack \
            --parameter-overrides \
              EnvironmentName=staging \
              DockerImageUri=$IMAGE_URI \
              LabRoleArn=${{ secrets.LAB_ROLE_ARN }} \
              VpcId=${{ secrets.VPC_ID }} \
              SubnetIds="${{ secrets.SUBNET_IDS }}" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changes

      - name: Get Staging Outputs
        id: get_stack_outputs
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          STACK_OUTPUTS=$(aws cloudformation describe-stacks --stack-name calculadora-staging-stack --query "Stacks[0].Outputs" --output json)
          ALB_URL=$(echo $STACK_OUTPUTS | jq -r '.[] | select(.OutputKey=="ALBDnsName") | .OutputValue')
          echo "alb_url=http://${ALB_URL}/" >> $GITHUB_OUTPUT

  # ------------------------------------------------
  # JOB: Acceptance Tests en Staging
  # ------------------------------------------------
  test-staging:
    needs: [deploy-cfn-staging]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Acceptance Tests
        env:
          APP_BASE_URL: ${{ needs.deploy-cfn-staging.outputs.alb_url_staging }}
        run: |
          echo "Running acceptance tests on: $APP_BASE_URL"
          sleep 30
          pytest tests/test_acceptance_app.py

  # ------------------------------------------------
  # JOB: Deploy a Producción
  # ------------------------------------------------
  deploy-cfn-prod:
    needs: build-test-publish
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      alb_url_prod: ${{ steps.get_stack_outputs.outputs.alb_url }}
      cluster_name_prod: "calculadora-production-cluster"
      service_name_prod: "calculadora-production-service"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Deploy CloudFormation Production
        run: |
          IMAGE_URI="jeroggz/proyecto-cicd:main-${{ needs.build-test-publish.outputs.image_tag }}"
          echo "Deploying Image: $IMAGE_URI"

          aws cloudformation deploy \
            --template-file template.yaml \
            --stack-name calculadora-prod-stack \
            --parameter-overrides \
              EnvironmentName=production \
              DockerImageUri=$IMAGE_URI \
              LabRoleArn=${{ secrets.LAB_ROLE_ARN }} \
              VpcId=${{ secrets.VPC_ID }} \
              SubnetIds="${{ secrets.SUBNET_IDS }}" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changes

      - name: Get Production Outputs
        id: get_stack_outputs
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          STACK_OUTPUTS=$(aws cloudformation describe-stacks --stack-name calculadora-prod-stack --query "Stacks[0].Outputs" --output json)
          ALB_URL=$(echo $STACK_OUTPUTS | jq -r '.[] | select(.OutputKey=="ALBDnsName") | .OutputValue')
          echo "alb_url=http://${ALB_URL}/" >> $GITHUB_OUTPUT

  # ------------------------------------------------
  # JOB: Smoke Tests Producción
  # ------------------------------------------------
  smoke-test-prod:
    needs: [deploy-cfn-prod]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Smoke Tests
        env:
          APP_BASE_URL: ${{ needs.deploy-cfn-prod.outputs.alb_url_prod }}
        run: |
          echo "Running smoke tests on: $APP_BASE_URL"
          sleep 30
          pytest tests/test_smoke_app.py
